<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden}iframe{border:0;width:1440px;height:950px;display:block}</style>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById("f");
if (q.get("w")) { f.style.width = q.get("w")+"px"; f.style.height = (q.get("h")||950)+"px"; }
f.src = q.get("p") || "/";
f.onload = () => { f.contentDocument.documentElement.style.scrollBehavior="auto";
  f.contentWindow.scrollTo(0, +(q.get("y")||0));
  // let reveal animations fire for the scrolled-to region
  setTimeout(()=>{ f.contentWindow.dispatchEvent(new Event("scroll")); }, 200); };
</script>
